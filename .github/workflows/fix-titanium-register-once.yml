name: One-shot Titanium extension registration fix

on:
  push:
    branches: ['refactor/titanium-extension']
    paths: ['.github/workflows/fix-titanium-register-once.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/titanium-extension
          fetch-depth: 0
      - name: Apply Titanium registration patch
        run: |
          echo '' | base64 -d | python3
      - name: Verify source patch
        run: |
          grep -q 'ensureTitaniumExtensionRegistered();' app/src/main/java/com/yagay/aihub/titanium/TitaniumManager.java
          grep -q 'isExtensionRegistered()' app/src/main/java/com/yagay/aihub/titanium/TitaniumManager.java
          git diff --check
      - name: Commit source fix
        run: |
          git config user.name 'AIHub CI'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/yagay/aihub/titanium/TitaniumManager.java
          git commit -m 'Cold-start Titanium to register bridge extension'
          git push origin HEAD:refactor/titanium-extension
