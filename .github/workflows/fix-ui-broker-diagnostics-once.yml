name: One-shot UI broker migration and diagnostics fix

on:
  push:
    branches: ['refactor/titanium-extension']
    paths: ['.github/workflows/fix-ui-broker-diagnostics-once.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/titanium-extension
          fetch-depth: 0
      - name: Apply broker diagnostics and NextChat migration patch
        run: |
          echo '' | base64 -d | python3
      - name: Verify patch
        run: |
          grep -q 'totalChatRequests' app/src/main/java/com/yagay/aihub/bridge/LocalBroker.java
          grep -q 'version: 3' ui/patch_nextchat.py
          grep -q 'version: 4.2' ui/patch_nextchat.py
          git diff --check
      - name: Commit source fix
        run: |
          git config user.name 'AIHub CI'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/yagay/aihub/bridge/LocalBroker.java ui/patch_nextchat.py
          git commit -m 'Migrate NextChat to local broker and add bridge diagnostics'
          git push origin HEAD:refactor/titanium-extension
