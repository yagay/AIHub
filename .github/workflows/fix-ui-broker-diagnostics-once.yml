name: One-shot UI broker compatibility fix

on:
  push:
    branches: ['refactor/titanium-extension']
    paths: ['.github/workflows/fix-ui-broker-diagnostics-once.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/titanium-extension
          fetch-depth: 0
      - name: Patch LocalBroker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/yagay/aihub/bridge/LocalBroker.java')
          t = p.read_text(encoding='utf-8')

          def rep(old, new):
              global t
              if old not in t:
                  raise SystemExit('missing marker: ' + old[:120])
              t = t.replace(old, new, 1)

          rep('''    private volatile boolean running;
              private ServerSocket server;
          ''', '''    private volatile boolean running;
              private ServerSocket server;
              private long totalChatRequests;
              private long totalAssignments;
              private long totalResults;
              private long totalErrors;
              private String lastModel = "";
              private String lastProvider = "";
              private String lastStage = "startup";
              private String lastError = "";
          ''')

          rep('''                root.put("knownCommands", commands.size());
          ''', '''                root.put("knownCommands", commands.size());
                          root.put("totalChatRequests", totalChatRequests);
                          root.put("totalAssignments", totalAssignments);
                          root.put("totalResults", totalResults);
                          root.put("totalErrors", totalErrors);
                          root.put("lastModel", lastModel);
                          root.put("lastProvider", lastProvider);
                          root.put("lastStage", lastStage);
                          root.put("lastError", lastError);
          ''')

          rep('''        String provider = MODEL_TO_PROVIDER.get(model);
                  if (provider == null) {
                      writeJson(out, 400,
                              new JSONObject().put("error",
                                      new JSONObject().put("message", "Unsupported web model: " + model)),
                              origin);
                      return;
                  }
          ''', '''        String provider = MODEL_TO_PROVIDER.get(model);
                  if (provider == null) {
                      // Compatibility for conversations persisted before AIHub switched
                      // NextChat to the dedicated *-web model names.
                      provider = "chatgpt";
                  }
                  synchronized (lock) {
                      totalChatRequests++;
                      lastModel = model;
                      lastProvider = provider;
                      lastStage = "chat_received";
                      lastError = "";
                  }
          ''')

          rep('''                                candidateClient.assigned.add(candidate.id);
                                          break;
          ''', '''                                candidateClient.assigned.add(candidate.id);
                                          totalAssignments++;
                                          lastProvider = candidate.provider;
                                          lastStage = "assigned";
                                          lastError = "";
                                          break;
          ''')

          rep('''                if (future != null) {
                              future.complete(new Result(
                                      message.optString("response", ""),
                                      message.optString("error", "")));
                          }
          ''', '''                if (future != null) {
                              String resultError = message.optString("error", "");
                              synchronized (lock) {
                                  totalResults++;
                                  if (resultError.isEmpty()) {
                                      lastStage = "result_ok";
                                      lastError = "";
                                  } else {
                                      totalErrors++;
                                      lastStage = "result_error";
                                      lastError = resultError.length() > 240
                                              ? resultError.substring(0, 240)
                                              : resultError;
                                  }
                              }
                              future.complete(new Result(
                                      message.optString("response", ""), resultError));
                          }
          ''')

          p.write_text(t, encoding='utf-8')
          PY
      - name: Verify patch
        run: |
          grep -q 'totalChatRequests' app/src/main/java/com/yagay/aihub/bridge/LocalBroker.java
          grep -q 'provider = "chatgpt"' app/src/main/java/com/yagay/aihub/bridge/LocalBroker.java
          git diff --check
      - name: Commit source fix
        run: |
          git config user.name 'AIHub CI'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/yagay/aihub/bridge/LocalBroker.java
          git commit -m 'Add broker request diagnostics and legacy model fallback'
          git push origin HEAD:refactor/titanium-extension
