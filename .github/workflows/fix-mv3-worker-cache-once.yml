name: One-shot MV3 worker cache refresh fix

on:
  push:
    branches: ['refactor/titanium-extension']
    paths: ['.github/workflows/fix-mv3-worker-cache-once.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/titanium-extension
          fetch-depth: 0
      - name: Refresh Chromium MV3 worker cache on AIHub extension updates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/yagay/aihub/titanium/TitaniumManager.java')
          t = p.read_text(encoding='utf-8')

          old = '''        boolean staleProfileRegistration = purgeStaleExtensionProfileRegistration();\n        ensureTitaniumExtensionRegistered();\n        if (extensionFilesChanged || staleProfileRegistration) {\n'''
          new = '''        boolean staleProfileRegistration = purgeStaleExtensionProfileRegistration();\n        if (extensionFilesChanged || staleProfileRegistration) {\n            purgeChromiumServiceWorkerRuntime();\n        }\n        ensureTitaniumExtensionRegistered();\n        if (extensionFilesChanged || staleProfileRegistration) {\n'''
          if old not in t:
              raise SystemExit('prepare marker missing')
          t = t.replace(old, new, 1)

          marker = '''    private void restartTitaniumForExtensionActivation() throws Exception {\n'''
          helper = '''    /**\n     * MV3 service workers are persisted separately from Extensions/<id>. Chromium can\n     * therefore unpack the new CRX while restarting a cached worker from the previous\n     * version. On AIHub extension upgrades, stop Titanium and remove only Chromium's\n     * Service Worker runtime/cache directories. Cookies, logins, local storage, history,\n     * tabs, and extension files are left intact; pages re-register service workers on use.\n     */\n    private void purgeChromiumServiceWorkerRuntime() throws Exception {\n        String profiles = titaniumDataDir + "/app_chrome";\n        String profilePattern = q(profiles) + "/*";\n        String command = "am force-stop " + PACKAGE + "; sleep 1; "\n                + "for profile in " + profilePattern + "; do "\n                + "[ -d \\\"$profile\\\" ] || continue; "\n                + "[ -d \\\"$profile/Service Worker\\\" ] && rm -rf \\\"$profile/Service Worker\\\"; "\n                + "done; true";\n        runSu(command, 15);\n        launched.clear();\n    }\n\n'''
          if marker not in t:
              raise SystemExit('restart marker missing')
          t = t.replace(marker, helper + marker, 1)
          p.write_text(t, encoding='utf-8')
          PY
      - name: Verify patch
        run: |
          grep -q 'purgeChromiumServiceWorkerRuntime' app/src/main/java/com/yagay/aihub/titanium/TitaniumManager.java
          grep -q 'Service Worker' app/src/main/java/com/yagay/aihub/titanium/TitaniumManager.java
          git diff --check
      - name: Commit source fix
        run: |
          git config user.name 'AIHub CI'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/yagay/aihub/titanium/TitaniumManager.java
          git commit -m 'Refresh Chromium MV3 worker cache on extension updates'
          git push origin HEAD:refactor/titanium-extension
