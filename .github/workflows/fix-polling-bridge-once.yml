name: One-shot polling bridge runtime fix

on:
  push:
    branches: ['refactor/titanium-extension']
    paths: ['.github/workflows/fix-polling-bridge-once.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/titanium-extension
          fetch-depth: 0
      - name: Patch broker progress and extension activation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing marker: {label}')
              return text.replace(old, new, 1)

          broker = Path('app/src/main/java/com/yagay/aihub/bridge/LocalBroker.java')
          t = broker.read_text(encoding='utf-8')
          t = replace_once(t,
          '''    private long totalResults;\n    private long totalErrors;\n    private String lastModel = "";\n''',
          '''    private long totalResults;\n    private long totalErrors;\n    private long totalProgressEvents;\n    private long lastProgressTextLength;\n    private int lastProgressContainerCount;\n    private String lastProgressPhase = "";\n    private String lastModel = "";\n''', 'broker fields')

          t = replace_once(t,
          '''                root.put("totalResults", totalResults);\n                root.put("totalErrors", totalErrors);\n                root.put("lastModel", lastModel);\n''',
          '''                root.put("totalResults", totalResults);\n                root.put("totalErrors", totalErrors);\n                root.put("totalProgressEvents", totalProgressEvents);\n                root.put("lastProgressPhase", lastProgressPhase);\n                root.put("lastProgressTextLength", lastProgressTextLength);\n                root.put("lastProgressContainerCount", lastProgressContainerCount);\n                root.put("lastModel", lastModel);\n''', 'broker diagnostic fields')

          result_marker = '''            if ("result".equals(type)) {\n'''
          progress_block = '''            if ("progress".equals(type)) {\n                String id = message.optString("id", "");\n                synchronized (lock) {\n                    if (pending.containsKey(id)) {\n                        totalProgressEvents++;\n                        String stage = message.optString("stage", "progress");\n                        lastStage = stage.isEmpty() ? "progress" : stage;\n                        lastProgressPhase = message.optString("phase", "");\n                        lastProgressTextLength = Math.max(0L, message.optLong("textLength", 0L));\n                        lastProgressContainerCount = Math.max(0, message.optInt("containerCount", 0));\n                        lastError = "";\n                    }\n                }\n                return;\n            }\n\n'''
          t = replace_once(t, result_marker, progress_block + result_marker, 'broker progress handler')
          broker.write_text(t, encoding='utf-8')

          titanium = Path('app/src/main/java/com/yagay/aihub/titanium/TitaniumManager.java')
          t = titanium.read_text(encoding='utf-8')
          old_if = '''        if (!expectedBuild.equals(installedBuild) || !"yes".equals(installedFilesOk)) {\n'''
          new_if = '''        boolean extensionFilesChanged = !expectedBuild.equals(installedBuild) || !"yes".equals(installedFilesOk);\n        if (extensionFilesChanged) {\n'''
          t = replace_once(t, old_if, new_if, 'extension changed flag')

          old_ready = '''        ensureTitaniumExtensionRegistered();\n        prepared = true;\n'''
          new_ready = '''        ensureTitaniumExtensionRegistered();\n        if (extensionFilesChanged) {\n            // Chromium may unpack an external-extension update while the old MV3\n            // worker remains alive until the next browser process start. Restart\n            // once more after the exact build appears in the profile so the newly\n            // installed service worker/content script become the active runtime.\n            restartTitaniumForExtensionActivation();\n        }\n        prepared = true;\n'''
          t = replace_once(t, old_ready, new_ready, 'post registration activation')

          method_marker = '''    private boolean isExtensionRegistered() throws Exception {\n'''
          helper = '''    private void restartTitaniumForExtensionActivation() throws Exception {\n        int uidDerivedUser = android.os.Process.myUid() / 100000;\n        String currentUser = runSu("cmd activity get-current-user 2>/dev/null || am get-current-user 2>/dev/null || echo "\n                + uidDerivedUser, 5).trim();\n        if (currentUser.isEmpty() || !currentUser.matches("\\\\d+")) {\n            currentUser = String.valueOf(uidDerivedUser);\n        }\n\n        String restart = "am force-stop " + PACKAGE\n                + "; sleep 1; monkey --user " + currentUser + " -p " + PACKAGE\n                + " -c android.intent.category.LAUNCHER 1 >/dev/null 2>&1"\n                + " || am start --user " + currentUser\n                + " -a android.intent.action.VIEW -d 'https://chatgpt.com/' -p " + PACKAGE\n                + " >/dev/null 2>&1 || true";\n        runSu(restart, 12);\n        Thread.sleep(1500);\n        runSu("am start --activity-reorder-to-front -n com.yagay.aihub/com.yagay.aihub.app.MainActivity"\n                + " >/dev/null 2>&1 || true", 5);\n        launched.clear();\n    }\n\n'''
          t = replace_once(t, method_marker, helper + method_marker, 'activation helper')
          titanium.write_text(t, encoding='utf-8')
          PY
      - name: Verify patch
        run: |
          grep -q 'totalProgressEvents' app/src/main/java/com/yagay/aihub/bridge/LocalBroker.java
          grep -q '"progress".equals(type)' app/src/main/java/com/yagay/aihub/bridge/LocalBroker.java
          grep -q 'extensionFilesChanged' app/src/main/java/com/yagay/aihub/titanium/TitaniumManager.java
          grep -q 'restartTitaniumForExtensionActivation' app/src/main/java/com/yagay/aihub/titanium/TitaniumManager.java
          git diff --check
      - name: Commit source fix
        run: |
          git config user.name 'AIHub CI'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/yagay/aihub/bridge/LocalBroker.java app/src/main/java/com/yagay/aihub/titanium/TitaniumManager.java
          git commit -m 'Add polling progress diagnostics and activate extension updates'
          git push origin HEAD:refactor/titanium-extension
