name: One-shot nsenter compatibility fix

on:
  push:
    branches: ['refactor/titanium-extension']
    paths: ['.github/workflows/fix-nsenter-once.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/titanium-extension
          fetch-depth: 0
      - name: Patch Android Toybox nsenter command boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          paths = [
              Path('app/src/main/java/com/yagay/aihub/titanium/TitaniumManager.java'),
              Path('app/src/main/java/com/yagay/aihub/diagnostics/DiagnosticsExporter.java'),
          ]
          old = 'nsenter -t 1 -m sh -c '
          new = 'nsenter -t 1 -m -- sh -c '
          changed = 0
          for path in paths:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count == 0:
                  raise SystemExit(f'expected nsenter pattern missing in {path}')
              path.write_text(text.replace(old, new), encoding='utf-8')
              changed += count
              print(f'{path}: replaced {count}')
          if changed < 4:
              raise SystemExit(f'expected at least 4 replacements, got {changed}')
          PY
      - name: Commit source fix
        run: |
          git config user.name 'AIHub CI'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/yagay/aihub/titanium/TitaniumManager.java app/src/main/java/com/yagay/aihub/diagnostics/DiagnosticsExporter.java
          git diff --cached --check
          git commit -m 'Fix Android Toybox nsenter command boundary'
          git push origin HEAD:refactor/titanium-extension
