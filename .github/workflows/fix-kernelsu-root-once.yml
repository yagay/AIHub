name: One-shot KernelSU root detection fix

on:
  push:
    branches: ['refactor/titanium-extension']
    paths: ['.github/workflows/fix-kernelsu-root-once.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/titanium-extension
          fetch-depth: 0
      - name: Apply KernelSU patch
        run: |
          echo '' | base64 -d | python3
      - name: Verify source patch
        run: |
          grep -q 'runSuRaw("id -u", 30)' app/src/main/java/com/yagay/aihub/titanium/TitaniumManager.java
          grep -q 'AIHUB_NS_OK' app/src/main/java/com/yagay/aihub/titanium/TitaniumManager.java
          grep -q 'namespace=caller-fallback' app/src/main/java/com/yagay/aihub/diagnostics/DiagnosticsExporter.java
          git diff --check
      - name: Commit source fix
        run: |
          git config user.name 'AIHub CI'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/yagay/aihub/titanium/TitaniumManager.java app/src/main/java/com/yagay/aihub/diagnostics/DiagnosticsExporter.java
          git commit -m 'Fix KernelSU root authorization detection'
          git push origin HEAD:refactor/titanium-extension
