name: One-shot KernelSU root detection fix

on:
  push:
    branches: ['refactor/titanium-extension']
    paths: ['.github/workflows/fix-kernelsu-root-once.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/titanium-extension
          fetch-depth: 0

      - name: Fix KernelSU root detection and namespace probing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manager = Path('app/src/main/java/com/yagay/aihub/titanium/TitaniumManager.java')
          text = manager.read_text(encoding='utf-8')

          old = 'uid = runSu("id -u", 30).trim();'
          new = 'uid = runSuRaw("id -u", 30).trim();'
          if old not in text:
              raise SystemExit('assertRoot runSu pattern missing')
          text = text.replace(old, new, 1)

          text = text.replace(
              'throw new IllegalStateException("无法获得 Root：请在 KernelSU/Magisk 中允许 AIHub。详情: "',
              'throw new IllegalStateException("无法获得 Root：请在 KernelSU / KernelSU Next / Magisk 中允许 AIHub。详情: "',
              1,
          )

          pattern = re.compile(r'''    /\*\*\n     \* KernelSU/Magisk root can still inherit.*?\n    private static String q\(String value\) \{''', re.S)
          replacement = r'''    /**
     * KernelSU/Magisk may grant uid 0 while still leaving the app in its own mount
     * namespace. Root authorization and mount-namespace access are intentionally
     * detected separately so a broken nsenter implementation is never reported as
     * "no root".
     */
    private static volatile String namespaceMode;

    private static String runSuRaw(String command, int timeoutSeconds) throws Exception {
        java.lang.Process process = null;
        Exception startError = null;
        String[] candidates = {"su", "/system/bin/su", "/system/xbin/su", "/sbin/su"};
        for (String candidate : candidates) {
            try {
                process = new ProcessBuilder(candidate, "-c", command)
                        .redirectErrorStream(true)
                        .start();
                break;
            } catch (Exception error) {
                startError = error;
            }
        }
        if (process == null) {
            throw new IllegalStateException("系统找不到可用的 su 命令", startError);
        }

        ByteArrayOutputStream output = new ByteArrayOutputStream();
        java.lang.Process runningProcess = process;
        Thread reader = new Thread(() -> {
            try (InputStream in = runningProcess.getInputStream()) {
                byte[] buffer = new byte[8192];
                int count;
                while ((count = in.read(buffer)) >= 0) if (count > 0) output.write(buffer, 0, count);
            } catch (Exception ignored) {}
        }, "AIHub-su-reader");
        reader.start();
        if (!process.waitFor(timeoutSeconds, TimeUnit.SECONDS)) {
            process.destroyForcibly();
            reader.join(1000);
            throw new IllegalStateException("Root 命令等待超时");
        }
        reader.join(1000);
        String result = new String(output.toByteArray(), StandardCharsets.UTF_8);
        if (process.exitValue() != 0) {
            throw new IllegalStateException("su exit=" + process.exitValue() + ": " + result.trim());
        }
        return result;
    }

    private static String resolveNamespaceMode() throws Exception {
        String cached = namespaceMode;
        if (cached != null) return cached;
        synchronized (TitaniumManager.class) {
            if (namespaceMode != null) return namespaceMode;

            String probe = runSuRaw(
                    "if command -v nsenter >/dev/null 2>&1 && [ -r /proc/1/ns/mnt ]; then "
                            + "nsenter -t 1 -m -- sh -c 'printf AIHUB_NS_OK' 2>/dev/null || true; fi",
                    8).trim();
            if ("AIHUB_NS_OK".equals(probe)) {
                namespaceMode = "nsenter";
                return namespaceMode;
            }

            probe = runSuRaw(
                    "if toybox nsenter --help >/dev/null 2>&1 && [ -r /proc/1/ns/mnt ]; then "
                            + "toybox nsenter -t 1 -m -- sh -c 'printf AIHUB_NS_OK' 2>/dev/null || true; fi",
                    8).trim();
            if ("AIHUB_NS_OK".equals(probe)) {
                namespaceMode = "toybox";
                return namespaceMode;
            }

            namespaceMode = "caller";
            return namespaceMode;
        }
    }

    private static String runSu(String command, int timeoutSeconds) throws Exception {
        String inner = q(command);
        String mode = resolveNamespaceMode();
        String wrapped;
        if ("nsenter".equals(mode)) {
            wrapped = "nsenter -t 1 -m -- sh -c " + inner;
        } else if ("toybox".equals(mode)) {
            wrapped = "toybox nsenter -t 1 -m -- sh -c " + inner;
        } else {
            wrapped = "sh -c " + inner;
        }
        return runSuRaw(wrapped, timeoutSeconds);
    }

    private static String q(String value) {'''

          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'failed to replace runSu block: {count}')
          manager.write_text(text, encoding='utf-8')

          diag = Path('app/src/main/java/com/yagay/aihub/diagnostics/DiagnosticsExporter.java')
          d = diag.read_text(encoding='utf-8')
          old_ns = '''String namespaced = "if command -v nsenter >/dev/null 2>&1 && [ -r /proc/1/ns/mnt ]; then "
                    + "echo namespace=pid1-nsenter; nsenter -t 1 -m -- sh -c " + inner
                    + "; elif toybox nsenter --help >/dev/null 2>&1 && [ -r /proc/1/ns/mnt ]; then "
                    + "echo namespace=pid1-toybox-nsenter; toybox nsenter -t 1 -m -- sh -c " + inner
                    + "; else echo namespace=caller-fallback; sh -c " + inner + "; fi";'''
          new_ns = '''String namespaced = "if command -v nsenter >/dev/null 2>&1 && [ -r /proc/1/ns/mnt ] "
                    + "&& nsenter -t 1 -m -- sh -c 'exit 0' 2>/dev/null; then "
                    + "echo namespace=pid1-nsenter; nsenter -t 1 -m -- sh -c " + inner
                    + "; elif toybox nsenter --help >/dev/null 2>&1 && [ -r /proc/1/ns/mnt ] "
                    + "&& toybox nsenter -t 1 -m -- sh -c 'exit 0' 2>/dev/null; then "
                    + "echo namespace=pid1-toybox-nsenter; toybox nsenter -t 1 -m -- sh -c " + inner
                    + "; else echo namespace=caller-fallback; sh -c " + inner + "; fi";'''
          if old_ns not in d:
              raise SystemExit('diagnostic namespace block missing')
          d = d.replace(old_ns, new_ns, 1)
          diag.write_text(d, encoding='utf-8')
          PY

      - name: Verify source patch
        run: |
          grep -q 'runSuRaw("id -u", 30)' app/src/main/java/com/yagay/aihub/titanium/TitaniumManager.java
          grep -q 'AIHUB_NS_OK' app/src/main/java/com/yagay/aihub/titanium/TitaniumManager.java
          grep -q 'namespace=caller-fallback' app/src/main/java/com/yagay/aihub/diagnostics/DiagnosticsExporter.java
          git diff --check

      - name: Commit source fix
        run: |
          git config user.name 'AIHub CI'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/yagay/aihub/titanium/TitaniumManager.java app/src/main/java/com/yagay/aihub/diagnostics/DiagnosticsExporter.java
          git commit -m 'Fix KernelSU root authorization detection'
          git push origin HEAD:refactor/titanium-extension
