name: One-shot stale profile glob fix

on:
  push:
    branches: ['refactor/titanium-extension']
    paths: ['.github/workflows/fix-stale-profile-glob-once.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/titanium-extension
          fetch-depth: 0
      - name: Fix shell glob expansion for profile cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/yagay/aihub/titanium/TitaniumManager.java')
          t=p.read_text(encoding='utf-8')
          old='''        String profiles = titaniumDataDir + "/app_chrome";\n        String extensionRootGlob = profiles + "/*/Extensions/" + extensionId;\n        String detect = "stale=; for root in " + q(extensionRootGlob)\n'''
          new='''        String profiles = titaniumDataDir + "/app_chrome";\n        String extensionRootPattern = q(profiles) + "/*/Extensions/" + extensionId;\n        String detect = "stale=; for root in " + extensionRootPattern\n'''
          if old not in t: raise SystemExit('glob declaration marker missing')
          t=t.replace(old,new,1)
          old='''                + "for root in " + q(extensionRootGlob)\n'''
          new='''                + "for root in " + extensionRootPattern\n'''
          if old not in t: raise SystemExit('purge glob marker missing')
          t=t.replace(old,new,1)
          p.write_text(t,encoding='utf-8')
          PY
      - name: Verify patch
        run: |
          grep -q 'extensionRootPattern = q(profiles) + "/\*/Extensions/" + extensionId' app/src/main/java/com/yagay/aihub/titanium/TitaniumManager.java
          ! grep -q 'q(extensionRootGlob)' app/src/main/java/com/yagay/aihub/titanium/TitaniumManager.java
          git diff --check
      - name: Commit source fix
        run: |
          git config user.name 'AIHub CI'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main/java/com/yagay/aihub/titanium/TitaniumManager.java
          git commit -m 'Fix Titanium stale profile glob expansion'
          git push origin HEAD:refactor/titanium-extension
