name: Build AIHub Chromium APK

on:
  workflow_dispatch:
    inputs:
      chromium_ref:
        description: "Chromium ref from yagay/chromium (blank = chromium.version)"
        required: false
        default: ""
        type: string
      clean_build:
        description: "Delete out/AIHub before compiling"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: aihub-chromium-build
  cancel-in-progress: false

jobs:
  build:
    name: Build ChromePublic.apk with AIHub
    runs-on: self-hosted
    timeout-minutes: 720

    steps:
      - name: Checkout AIHub
        uses: actions/checkout@v5

      - name: Prepare persistent paths and check host
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$(uname -s)" != "Linux" ]]; then
            echo "AIHub Chromium builds require a Linux self-hosted runner." >&2
            exit 1
          fi
          case "$(uname -m)" in
            x86_64|amd64) ;;
            *) echo "Use an x86_64 Linux runner for Chromium builds." >&2; exit 1 ;;
          esac

          BUILD_ROOT="$HOME/.cache/aihub-build"
          CHROMIUM_ROOT="$BUILD_ROOT/chromium"
          DEPOT_TOOLS="$BUILD_ROOT/depot_tools"
          mkdir -p "$BUILD_ROOT"

          echo "BUILD_ROOT=$BUILD_ROOT" >> "$GITHUB_ENV"
          echo "CHROMIUM_ROOT=$CHROMIUM_ROOT" >> "$GITHUB_ENV"
          echo "DEPOT_TOOLS=$DEPOT_TOOLS" >> "$GITHUB_ENV"

          mem_kb="$(awk '/MemTotal/ {print $2}' /proc/meminfo)"
          if (( mem_kb < 8 * 1024 * 1024 )); then
            echo "At least 8 GiB RAM is required; 16-32 GiB is recommended." >&2
            exit 1
          fi
          if (( mem_kb < 16 * 1024 * 1024 )); then
            echo "::warning::Runner has less than 16 GiB RAM; Chromium compilation may be slow or fail under memory pressure."
          fi

          free_kb="$(df -Pk "$HOME" | awk 'NR==2 {print $4}')"
          if [[ -d "$CHROMIUM_ROOT/src/.git" ]]; then
            need_kb=$((25 * 1024 * 1024))
          else
            need_kb=$((120 * 1024 * 1024))
          fi
          if (( free_kb < need_kb )); then
            echo "Not enough free disk space under $HOME." >&2
            echo "Available: $((free_kb / 1024 / 1024)) GiB; required for this run: about $((need_kb / 1024 / 1024)) GiB." >&2
            exit 1
          fi

          echo "Runner resources:"
          free -h
          df -h "$HOME"

      - name: Resolve Chromium revision
        id: chromium_ref
        shell: bash
        run: |
          set -euo pipefail
          REF="${{ inputs.chromium_ref }}"
          if [[ -z "$REF" ]]; then
            REF="$(tr -d '\r\n ' < chromium.version)"
          fi
          if [[ -z "$REF" ]]; then
            echo "Chromium ref is empty." >&2
            exit 1
          fi
          echo "CHROMIUM_REF=$REF" >> "$GITHUB_ENV"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Using yagay/chromium ref: $REF"

      - name: Install or update depot_tools
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d "$DEPOT_TOOLS/.git" ]]; then
            rm -rf "$DEPOT_TOOLS"
            git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git "$DEPOT_TOOLS"
          else
            git -C "$DEPOT_TOOLS" fetch origin main
            git -C "$DEPOT_TOOLS" reset --hard origin/main
          fi
          echo "$DEPOT_TOOLS" >> "$GITHUB_PATH"

      - name: Create or update persistent Chromium checkout
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$DEPOT_TOOLS:$PATH"

          if [[ ! -d "$CHROMIUM_ROOT/src/.git" ]]; then
            rm -rf "$CHROMIUM_ROOT"
            mkdir -p "$CHROMIUM_ROOT"
            cd "$CHROMIUM_ROOT"
            fetch --nohooks android
          fi

          cd "$CHROMIUM_ROOT/src"
          # Remove AIHub overlay changes from the previous build while preserving ignored out/ directories.
          git reset --hard HEAD
          git clean -fd
          git remote set-url origin https://github.com/yagay/chromium.git
          git fetch --prune origin "$CHROMIUM_REF"
          git checkout --detach FETCH_HEAD

          echo "Chromium checkout: $(git rev-parse HEAD)"
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]]; then
            echo "Failed to select requested Chromium revision." >&2
            exit 1
          fi

      - name: Sync Chromium DEPS and Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$DEPOT_TOOLS:$PATH"
          cd "$CHROMIUM_ROOT"
          gclient sync -D --force --nohooks
          cd src
          gclient runhooks

      - name: Configure Android arm64 build
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$DEPOT_TOOLS:$PATH"
          cd "$CHROMIUM_ROOT/src"
          source build/android/envsetup.sh

          if [[ "${{ inputs.clean_build }}" == "true" ]]; then
            rm -rf out/AIHub
          fi

          mkdir -p out/AIHub
          cat > out/AIHub/args.gn <<'EOF'
          target_os = "android"
          target_cpu = "arm64"
          is_debug = false
          is_component_build = false
          symbol_level = 0
          dcheck_always_on = false
          use_remoteexec = false
          EOF
          gn gen out/AIHub

      - name: Apply AIHub overlay and build Chromium
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$DEPOT_TOOLS:$PATH"
          cd "$CHROMIUM_ROOT/src"
          source build/android/envsetup.sh
          cd "$GITHUB_WORKSPACE"
          bash scripts/build_aihub_chromium.sh "$CHROMIUM_ROOT/src" out/AIHub

      - name: Collect APK and checksums
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          APK="$CHROMIUM_ROOT/src/out/AIHub/apks/ChromePublic.apk"
          if [[ ! -f "$APK" ]]; then
            echo "ChromePublic.apk was not produced." >&2
            exit 1
          fi

          rm -rf "$GITHUB_WORKSPACE/build-artifact"
          mkdir -p "$GITHUB_WORKSPACE/build-artifact"
          cp "$APK" "$GITHUB_WORKSPACE/build-artifact/AIHub-ChromePublic.apk"
          sha256sum "$GITHUB_WORKSPACE/build-artifact/AIHub-ChromePublic.apk" \
            | tee "$GITHUB_WORKSPACE/build-artifact/AIHub-ChromePublic.apk.sha256"
          printf '%s\n' "$CHROMIUM_REF" > "$GITHUB_WORKSPACE/build-artifact/chromium-revision.txt"
          printf '%s\n' "$GITHUB_SHA" > "$GITHUB_WORKSPACE/build-artifact/aihub-revision.txt"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIHub-ChromePublic-${{ github.run_number }}
          path: build-artifact/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## AIHub Chromium build"
            echo
            echo "- Chromium fork: \`yagay/chromium\`"
            echo "- Chromium ref: \`${CHROMIUM_REF:-unknown}\`"
            echo "- AIHub ref: \`$GITHUB_SHA\`"
            echo "- Target: \`chrome_public_apk\` / arm64"
            echo "- Persistent checkout: \`$HOME/.cache/aihub-build/chromium\`"
            echo
            echo "Successful runs publish \`AIHub-ChromePublic.apk\` as a workflow artifact."
          } >> "$GITHUB_STEP_SUMMARY"
