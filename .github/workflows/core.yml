name: AIHub Android Build

on:
  push:
    branches:
      - main
      - 'refactor/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aihub-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - name: Validate browser provider configuration
        run: python3 tools/validate_providers.py

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build reused NextChat UI
        run: bash tools/build_nextchat_ui.sh

      - name: Prepare embedded browser gateway
        run: bash tools/build_mobile_gateway.sh

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK, NDK, CMake and build tools
        run: sdkmanager "platforms;android-37.1" "build-tools;36.0.0" "ndk;28.0.13004108" "cmake;3.22.1"

      - name: Build root CDP forwarder
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/28.0.13004108
        run: bash tools/build_cdp_forwarder.sh

      - name: Restore stable debug signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode ci/aihub-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build ARM64 debug APK
        run: >-
          gradle :app:assembleDebug
          -PaihubAbi=arm64-v8a
          -PaihubVersionCode=${{ github.run_number }}
          -PaihubVersionName=0.4.0.${{ github.run_number }}
          --stacktrace --no-daemon

      - name: Android lint
        run: >-
          gradle :app:lintDebug
          -PaihubAbi=arm64-v8a
          -PaihubVersionCode=${{ github.run_number }}
          -PaihubVersionName=0.4.0.${{ github.run_number }}
          --stacktrace --no-daemon

      - name: Upload ARM64 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AIHub-arm64-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
