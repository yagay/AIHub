name: AIHub Titanium Build

on:
  push:
    branches: [main, 'refactor/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aihub-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Titanium no-API extension
        run: bash tools/build_titanium_extension.sh

      - name: Build reused NextChat UI
        run: bash tools/build_nextchat_ui.sh

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.1" "build-tools;36.0.0"

      - name: Restore stable debug signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode ci/aihub-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build ARM64 debug APK
        run: >-
          gradle :app:assembleDebug
          -PaihubAbi=arm64-v8a
          -PaihubVersionCode=${{ github.run_number }}
          -PaihubVersionName=0.4.0.${{ github.run_number }}
          --stacktrace --no-daemon

      - name: Android lint
        run: >-
          gradle :app:lintDebug
          -PaihubAbi=arm64-v8a
          -PaihubVersionCode=${{ github.run_number }}
          -PaihubVersionName=0.4.0.${{ github.run_number }}
          --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIHub-titanium-arm64-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
