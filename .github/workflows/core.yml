name: AIHub Android Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aihub-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Validate provider configuration
        run: python3 tools/validate_providers.py

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 37.1
        run: sdkmanager "platforms;android-37.1" "build-tools;36.0.0"

      - name: Restore stable debug signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode ci/aihub-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build ARM64 debug APK
        run: >-
          gradle :app:assembleDebug
          -PaihubAbi=arm64-v8a
          -PaihubVersionCode=${{ github.run_number }}
          -PaihubVersionName=0.3.0.${{ github.run_number }}
          --stacktrace --no-daemon

      - name: Android lint
        run: >-
          gradle :app:lintDebug
          -PaihubAbi=arm64-v8a
          -PaihubVersionCode=${{ github.run_number }}
          -PaihubVersionName=0.3.0.${{ github.run_number }}
          --stacktrace --no-daemon

      - name: Upload ARM64 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AIHub-arm64-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
