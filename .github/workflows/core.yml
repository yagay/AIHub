name: AIHub Core Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Check script syntax
        run: |
          bash -n scripts/*.sh
          python3 -m py_compile scripts/*.py
      - name: Validate provider rules and architecture
        run: python3 scripts/validate_provider_rules.py
      - name: Validate repository wiring
        run: python3 scripts/validate_repo.py
      - name: Run core smoke test
        run: bash scripts/run_core_smoke_test.sh
